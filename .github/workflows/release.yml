name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Build, test and package universal DMG
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j3
          QT_QPA_PLATFORM=offscreen ctest --test-dir cpp/build --output-on-failure
          ./cpp/build/syspeek.app/Contents/MacOS/syspeek --dump \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["processCount"]>0 and d["host"]["cores"]>0; print("mac dump ok:", d["processCount"], "procs")'
          SYSPEEK_BUILD_DIR=cpp/build bash cpp/packaging/build_macos.sh

      - name: Upload macos artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            cpp/build/packaging/Syspeek-*-macos.dmg
            cpp/build/packaging/Syspeek-*-macos.dmg.sha256
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libgl-dev

      - name: Build and test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j"$(nproc)"
          QT_QPA_PLATFORM=offscreen ctest --test-dir cpp/build --output-on-failure

      - name: Build .deb
        run: bash cpp/packaging/build_deb.sh

      - name: Checksums + AUR refresh data
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=$version/" cpp/packaging/arch/PKGBUILD cpp/packaging/arch/syspeek-bin/PKGBUILD
          cd cpp/build/packaging && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
          # Source tarball hash for the AUR `syspeek` package (publish-aur.sh
          # runs updpkgsums anyway; this is a cross-check).
          curl -sL "https://github.com/codeafridi/Syspeek/archive/refs/tags/v$version.tar.gz" -o /tmp/src.tar.gz
          echo "source tarball:" && sha256sum /tmp/src.tar.gz | tee /tmp/src.sha
          cp /tmp/src.sha "$GITHUB_WORKSPACE/cpp/build/packaging/SOURCE_SHA256.txt" 2>/dev/null || true

      - name: Validate packaging files
        run: |
          bash -n cpp/packaging/arch/publish-aur.sh
          bash -n cpp/packaging/build_ppa.sh
          bash -n cpp/packaging/build_appimage.sh
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('cpp/packaging/obs/_service'); print('obs _service: valid XML')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            cpp/build/packaging/*.deb
            cpp/build/packaging/SHA256SUMS

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Build, test and dump smoke
        shell: pwsh
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release
          ctest --test-dir cpp/build -C Release --output-on-failure
          $json = & ./cpp/build/Release/syspeek.exe --dump | ConvertFrom-Json -AsHashtable
          if ($json.processCount -le 0) { throw "dump: no processes" }
          if ($json.host.cores -le 0) { throw "dump: no cores" }
          Write-Host ("windows dump ok: {0} procs" -f $json.processCount)

      - name: Build MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          pwsh -NoProfile -ExecutionPolicy Bypass -File cpp/packaging/windows/build_msi.ps1 -Version $version
          Get-ChildItem cpp/build/packaging

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            cpp/build/packaging/Syspeek-*-windows.msi
            cpp/build/packaging/Syspeek-*-windows.msi.sha256
            cpp/build/packaging/Syspeek-*-windows-portable.zip
            cpp/build/packaging/Syspeek-*-windows-portable.zip.sha256
          if-no-files-found: error

  github-release:
    needs: [build, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist-ci
      - uses: actions/download-artifact@v4
        with:
          name: packages-macos
          path: dist-macos
      - uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: dist-windows
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-ci/*.deb
            dist-ci/SHA256SUMS
            dist-macos/*.dmg
            dist-macos/*.dmg.sha256
            dist-windows/*.msi
            dist-windows/*.msi.sha256
            dist-windows/*-portable.zip
            dist-windows/*-portable.zip.sha256
          generate_release_notes: true
      # NOTE: the portable tarball + AppImage (with zsync) are built by the
      # maintainer via bash cpp/packaging/build_portable.sh && bash
      # cpp/packaging/build_appimage.sh and attached to the same release, so
      # `syspeek update` and AppImage delta updates keep working.
