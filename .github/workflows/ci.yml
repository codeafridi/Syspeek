name: CI

on:
  push:
    branches: [main, feat_macos, feat_m39, feat_m50, feat_m52, feat_m53, feat_m54, feat_m55, feat_m58, feat_m62, feat_m63, feat_m64, feat_m65, feat_m66, feat_m67, feat_m68]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        if: runner.os == 'Windows'

      - uses: jurplel/install-qt-action@v4.2.1
        with:
          version: "6.8.*"
          cache: true
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}
          setup-python: ${{ runner.os != 'Windows' }}

      - name: Configure (unix)
        if: runner.os != 'Windows'
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (windows)
        if: runner.os == 'Windows'
        run: cmake -S cpp -B cpp/build

      - name: Build (unix)
        if: runner.os != 'Windows'
        run: cmake --build cpp/build -j 3

      - name: Build (windows)
        if: runner.os == 'Windows'
        run: cmake --build cpp/build --config Release -j 3

      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Dump smoke
        if: runner.os != 'Windows'
        run: |
          SYSPEEK_BIN=./cpp/build/syspeek
          if [ "$(uname -s)" = "Darwin" ] && [ -x ./cpp/build/syspeek.app/Contents/MacOS/syspeek ]; then
            SYSPEEK_BIN=./cpp/build/syspeek.app/Contents/MacOS/syspeek
          fi
          echo "syspeek binary: $SYSPEEK_BIN"
          "$SYSPEEK_BIN" --dump > "${RUNNER_TEMP}/syspeek-dump.json"
          ps ax | wc -l > "${RUNNER_TEMP}/ps-count.txt"
          python3 - "${RUNNER_TEMP}/syspeek-dump.json" \
            "${RUNNER_TEMP}/ps-count.txt" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          h = d["host"]
          assert d["processCount"] > 0, d
          assert len(d["processes"]) > 0, d
          assert h["cores"] > 0, h
          assert h["memTotalKb"] > 0, h
          ps_count = int(open(sys.argv[2]).read().split()[0])
          # ps counts itself + header; allow generous tolerance
          assert abs(d["processCount"] - ps_count) < max(30, ps_count // 2), (
              d["processCount"], ps_count)
          print("dump ok:", d["platform"], h["cores"], "cores",
                int(h["memTotalKb"] // 1024), "MiB", d["processCount"], "procs",
                "(ps ≈", ps_count, ")")
          if d["platform"] == "linux":
              k = h
              assert k["somaxconn"] > 0 and k["fdMax"] > 0, k
              assert k["runningProcs"] >= 0, k
              print("kernel ok: fd %d somaxconn %d cc %s run %d blocked %d"
                    % (int(k["fdAllocated"]), int(k["somaxconn"]),
                       k.get("congestion", "-"), k["runningProcs"],
                       k["blockedProcs"]))
              td = d["tcpDiag"]
              assert td["queried"] is True, td
              assert td["count"] >= 0 and td["withInfo"] >= 0, td
              print("tcpdiag ok: %d sockets, %d with tcp_info"
                    % (td["count"], td["withInfo"]))
          tcp = d.get("tcp", {})
          if tcp.get("available"):
              for key in ("inSegs", "outSegs", "retransSegs", "timeouts"):
                  v = tcp.get(key)
                  assert isinstance(v, int) and v >= 0, (key, v)
              print("tcp ok: in %d out %d retrans %d timeouts %d"
                    % (tcp["inSegs"], tcp["outSegs"], tcp["retransSegs"],
                       tcp["timeouts"]))
              extra = {k: v for k, v in tcp.items() if k.startswith("ext.")}
              if extra:
                  print("tcp extras:", json.dumps(extra, sort_keys=True))
          else:
              print("tcp sysctl unavailable (kernel denies) - stays gated")
          fs = d.get("filesystems", {}).get("entries", [])
          assert fs, "filesystems block"
          assert all(e["freeG"] <= e["totalG"] + 0.01
                     for e in fs if "freeG" in e), fs[:3]
          print("filesystems ok:", len(fs), "entries")
          PY
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Probe smoke
        if: runner.os != 'Windows'
        run: |
          SYSPEEK_BIN=./cpp/build/syspeek
          if [ "$(uname -s)" = "Darwin" ] && [ -x ./cpp/build/syspeek.app/Contents/MacOS/syspeek ]; then
            SYSPEEK_BIN=./cpp/build/syspeek.app/Contents/MacOS/syspeek
          fi
          "$SYSPEEK_BIN" --probe 3 > "${RUNNER_TEMP}/syspeek-probe.txt" 2>&1 \
            || { cat "${RUNNER_TEMP}/syspeek-probe.txt"; exit 1; }
          cat "${RUNNER_TEMP}/syspeek-probe.txt"
          grep -q "probe summary requested=3 received=3" \
            "${RUNNER_TEMP}/syspeek-probe.txt"
          grep -q "host=1 hostCpu" "${RUNNER_TEMP}/syspeek-probe.txt"
          ! grep -q "(overrun)" "${RUNNER_TEMP}/syspeek-probe.txt"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Probe smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./cpp/build/Release/syspeek.exe --probe 3 \
            > "${RUNNER_TEMP}/syspeek-probe.txt" 2>&1 \
            || { cat "${RUNNER_TEMP}/syspeek-probe.txt"; exit 1; }
          cat "${RUNNER_TEMP}/syspeek-probe.txt"
          grep -q "probe summary requested=3 received=3" \
            "${RUNNER_TEMP}/syspeek-probe.txt"
          grep -q "host=1 hostCpu" "${RUNNER_TEMP}/syspeek-probe.txt"
          ! grep -q "(overrun)" "${RUNNER_TEMP}/syspeek-probe.txt"

      - name: Dump smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          SYSPEEK_BIN=./cpp/build/Release/syspeek.exe
          echo "syspeek binary: $SYSPEEK_BIN"
          "$SYSPEEK_BIN" --dump > "${RUNNER_TEMP}/syspeek-dump.json"
          ps_count=$(powershell.exe -NoProfile -Command "(Get-Process).Count" | tr -d '\r')
          echo "Get-Process count: $ps_count"
          python - "${RUNNER_TEMP}/syspeek-dump.json" "$ps_count" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          h = d["host"]
          assert d["processCount"] > 0, d
          assert len(d["processes"]) > 0, d
          assert h["cores"] > 0, h
          assert h["memTotalKb"] > 0, h
          assert d["platform"] == "windows", d["platform"]
          print("dump ok: windows", h["cores"], "cores",
                int(h["memTotalKb"] // 1024 // 1024), "MiB",
                d["processCount"], "procs (Get-Process ~",
                sys.argv[2], ")")
          services = d.get("services", {})
          assert services.get("count", 0) > 0, services
          print("scm services ok:", services.get("count"),
                "running", services.get("running"),
                "failed", services.get("failed"))
          disks = d.get("disks", {})
          assert disks.get("instances", 0) > 0, disks
          print("disks ok:", disks.get("instances"), "instances,",
                disks.get("ioPerSec"), "io/s peak,",
                disks.get("utilPercent"), "% util peak")
          security = d.get("security", {})
          assert security.get("findings", 0) > 0, security
          print("posture ok:", security.get("findings"), "findings,",
                security.get("exposed"), "exposed,",
                security.get("grade"))
          fs = d.get("filesystems", {}).get("entries", [])
          assert fs, "filesystems block"
          assert all(e["freeG"] <= e["totalG"] + 0.01
                     for e in fs if "freeG" in e), fs[:3]
          print("filesystems ok:", len(fs), "entries")
          software = d.get("software", {})
          assert software.get("programs", 0) > 0, software
          print("software ok:", software.get("programs"),
                "installed programs")
          depth = d.get("selfDepth", {})
          assert depth.get("ctxSwitches", 0) > 0, depth
          assert depth.get("cmdlineLength", 0) > 0, depth
          assert depth.get("envPairs", 0) > 0, depth
          assert depth.get("threadRows", 0) > 0, depth
          print("self depth ok: ctx", depth.get("ctxSwitches"), ",",
                depth.get("cmdlineLength"), "chars cmdline,",
                depth.get("envPairs"), "env pairs,",
                depth.get("threadRows"), "thread rows")
          tcp = d.get("tcp", {})
          if tcp.get("available"):
              for key in ("inSegs", "outSegs", "retransSegs"):
                  v = tcp.get(key)
                  assert isinstance(v, int) and v >= 0, (key, v)
              print("tcp ok: in %d out %d retrans %d"
                    % (tcp["inSegs"], tcp["outSegs"], tcp["retransSegs"]))
          else:
              print("tcp gated:", tcp)
          PY
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package DMG (mac)
        if: runner.os == 'macOS'
        run: |
          SYSPEEK_BUILD_DIR=cpp/build bash cpp/packaging/build_macos.sh
          ls -la cpp/build/packaging/


      - name: Package MSI (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File cpp/packaging/windows/build_msi.ps1 -Version 0.0.0
          Get-ChildItem cpp/build/packaging

      - name: VC runtime bundled (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem cpp/build/packaging/Syspeek-*-windows-portable.zip |
            Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
              if ($names -notcontains $dll) { throw "MSVC runtime not bundled in zip: $dll" }
            }
            Write-Host "vc runtime bundled ok: $($names.Count) entries"
          } finally {
            $archive.Dispose()
          }
          $wxs = Get-Content cpp/packaging/windows/payload.wxs -Raw
          if ($wxs -notmatch 'vcruntime140\.dll') { throw 'payload.wxs missing vc runtime' }

      - name: Manifest smoke (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File cpp/packaging/windows/write_manifests.ps1 -Version 0.0.0
          $inst = Get-Content cpp/packaging/windows/manifests/0.0.0/Codeafridi.Syspeek.installer.yaml -Raw
          if ($inst -notmatch 'InstallerSha256:\s*[0-9a-f]{64}') { throw 'manifest: hash missing' }
          if ($inst -match '\$MSISHA|\$ZIPSHA|__MSISHA__|__ZIPSHA__') { throw 'manifest: unexpanded token' }
          $ver = Get-Content cpp/packaging/windows/manifests/0.0.0/Codeafridi.Syspeek.yaml -Raw
          if ($ver -notmatch '(?m)^DefaultLocale:\s*en-US\s*$') { throw 'manifest: version manifest missing DefaultLocale' }
          $loc = Get-Content cpp/packaging/windows/manifests/0.0.0/Codeafridi.Syspeek.locale.en-US.yaml -Raw
          if ($loc -notmatch '(?m)^PackageLocale:\s*en-US\s*$') { throw 'manifest: locale manifest missing PackageLocale' }
          Get-Content cpp/packaging/windows/manifests/scoop/syspeek-scoop.json | ConvertFrom-Json | Out-Null
          Write-Host 'manifest smoke ok'

      - name: Installer smoke (linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh -n install.sh
          # Release-race discipline (0.8.5 triage): resolving through the
          # moving `latest` alias is unsound — the tag run publishes the
          # release mid-smoke and the alias flips between probe and
          # download (observed live in run 40052429151: probe 200 against
          # v0.8.4, download 404 against the freshly-published v0.8.5
          # before its portable upload). Resolve ONCE from the newest
          # published release that actually carries the asset.
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=6" \
            --jq '.[] | select(.draft == false)
                  | select([.assets[].name] | index("syspeek-portable.tar.gz"))
                  | .tag_name' | head -1)"
          if [ -n "${tag}" ]; then
            export SYSPEEK_BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/syspeek-portable.tar.gz"
            echo "smoke bundle from: ${tag}"
          fi
          sh install.sh --no-bridge --no-autostart
          test -x "$HOME/.local/opt/syspeek/syspeek"
          test -x "$HOME/.local/bin/syspeek"
          "$HOME/.local/opt/syspeek/run.sh" --dump |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["processCount"]>0; print("linux install dump ok:", d["processCount"], "procs")'
          "$HOME/.local/bin/syspeek" status
          "$HOME/.local/bin/syspeek" --dump 2>/dev/null |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["processCount"]>0; print("linux wrapper passthrough ok")'
          sh install.sh --uninstall
          test ! -d "$HOME/.local/opt/syspeek"
          echo "linux installer ok"

      - name: Screenshot evidence (linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake --build cpp/build --target syspeek_screenshot -j 3
          mkdir -p "${RUNNER_TEMP}/screens"
          for i in $(seq 0 26); do
            QT_QPA_PLATFORM=offscreen ./cpp/build/syspeek_screenshot \
              "${RUNNER_TEMP}/screens/panel-$(printf '%02d' "$i").png" panel "$i"
          done
          ls -l "${RUNNER_TEMP}/screens"
          python3 - "${RUNNER_TEMP}/screens" <<'PY'
          import glob, os, sys
          files = sorted(glob.glob(os.path.join(sys.argv[1], "panel-*.png")))
          assert len(files) == 27, files
          tiny = [f for f in files if os.path.getsize(f) < 12000]
          assert not tiny, tiny
          print("screens ok:", len(files), "min",
                min(os.path.getsize(f) for f in files))
          PY

      - name: Upload screenshot artifact (linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: syspeek-screenshots
          path: ${{ runner.temp }}/screens/panel-*.png
          if-no-files-found: error

      - name: Installer smoke (mac)
        if: runner.os == 'macOS'
        run: |
          sh -n install.sh
          sh install.sh --no-autostart
          test -d /Applications/Syspeek.app
          test -x /Applications/Syspeek.app/Contents/MacOS/syspeek
          test -x /Applications/Syspeek.app/Contents/Resources/syspeek
          test -x /usr/local/bin/syspeek
          /Applications/Syspeek.app/Contents/MacOS/syspeek --dump > /tmp/mac-smoke-dump.json 2>/dev/null
          python3 - /tmp/mac-smoke-dump.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["processCount"] > 0 and d["host"]["cores"] > 0, d
          fs = d.get("filesystems", {}).get("entries", [])
          assert all(e["freeG"] <= e["totalG"] + 0.01
                     for e in fs if "freeG" in e), (
              fs[:3] if fs else "shipped bundle pre-M54: no block yet")
          extra = f", {len(fs)} fs" if fs else " (shipped pre-M54: no fs block)"
          print("mac install dump ok:", d["processCount"], "procs" + extra)
          PY
          /usr/local/bin/syspeek status
          sh install.sh --uninstall
          test ! -d /Applications/Syspeek.app
          test ! -f /usr/local/bin/syspeek
          echo "mac installer ok"

      - name: Installer smoke (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sh -n install.sh
          ZIPW=$(ls "$PWD"/cpp/build/packaging/Syspeek-*-windows-portable.zip | head -1)
          test -f "$ZIPW"
          WINZIP=$(cygpath -m "$ZIPW")
          SYSPEEK_WIN_URL="file:///$WINZIP" sh install.sh --no-autostart
          test -f "$LOCALAPPDATA/Syspeek/syspeek.exe"
          test -f "$LOCALAPPDATA/Microsoft/WindowsApps/syspeek.cmd"
          test -f "$LOCALAPPDATA/Microsoft/WindowsApps/syspeek"
          command -v syspeek
          syspeek --autostart=status
          cmd //c where syspeek
          grep -E 'WindowsApps' <<<"$PATH"
          "$LOCALAPPDATA/Syspeek/syspeek.exe" --autostart=status
          "$LOCALAPPDATA/Syspeek/syspeek.exe" stop
          "$LOCALAPPDATA/Syspeek/syspeek.exe" --dump > dump.json
          python3 -c 'import json; d=json.load(open("dump.json")); assert d["processCount"]>0; assert d.get("software",{}).get("programs",0)>0; print("win install dump ok:", d["processCount"], "procs", d.get("software"))'
          sh install.sh --uninstall
          test ! -d "$LOCALAPPDATA/Syspeek"
          test ! -f "$LOCALAPPDATA/Microsoft/WindowsApps/syspeek.cmd"
          test ! -f "$LOCALAPPDATA/Microsoft/WindowsApps/syspeek"
          echo "windows installer ok"

      - name: Installer smoke (windows pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-Item "$PWD/cpp/build/packaging/Syspeek-*-windows-portable.zip" | Select-Object -First 1)
          $env:SYSPEEK_WIN_URL = $zip.FullName
          Write-Host "using local zip: $env:SYSPEEK_WIN_URL"
          ./cpp/packaging/windows/install.ps1 -NoAutostart
          if (-not (Test-Path "$env:LOCALAPPDATA\Syspeek\syspeek.exe")) { throw 'install: exe missing' }
          $shim = Get-Command syspeek -ErrorAction Stop | Select-Object -ExpandProperty Source
          Write-Host "shim: $shim"
          $exe = "$env:LOCALAPPDATA\Syspeek\syspeek.exe"
          cmd /c "`"$exe`" stop"
          # A bare shim must detach its GUI child. This catches cmd.exe's
          # direct-GUI-exe behavior, which otherwise holds the terminal until
          # the HUD exits.
          $bareStart = [Diagnostics.Stopwatch]::StartNew()
          & $shim
          $bareStart.Stop()
          if ($LASTEXITCODE -ne 0 -or $bareStart.Elapsed.TotalSeconds -gt 5) {
            throw "bare syspeek did not return promptly (rc=$LASTEXITCODE, $($bareStart.Elapsed.TotalSeconds)s)"
          }
          Start-Sleep -Seconds 2
          cmd /c "`"$exe`" status > bare-status.out 2>&1"
          $bareStatus = Get-Content bare-status.out -Raw
          if ($bareStatus -notmatch 'other instances: [1-9]\d*') {
            throw "bare syspeek did not launch the HUD ($bareStatus)"
          }
          cmd /c "`"$exe`" stop"
          cmd /c "`"$exe`" start > start.out 2>&1"
          Write-Host "start rc=$LASTEXITCODE"
          $startOut = Get-Content start.out -Raw
          if ("$startOut" -notmatch 'started: HUD launched') { throw "start verb: unexpected output ($startOut)" }
          Start-Sleep -Seconds 2
          cmd /c "`"$exe`" start > start2.out 2>&1"
          $startAgainOut = Get-Content start2.out -Raw
          if ("$startAgainOut" -notmatch 'already running: \d+') { throw "start-already verb: unexpected output ($startAgainOut)" }
          cmd /c "`"$exe`" stop > stop.out 2>&1"
          $stopOut = Get-Content stop.out -Raw
          if ("$stopOut" -notmatch 'stopped: \d+') { throw "stop verb: unexpected output ($stopOut)" }
          cmd /c "`"$exe`" stop"
          cmd /c "`"$exe`" disable"
          cmd /c "`"$exe`" status > status.out 2>&1"
          $statusOut = Get-Content status.out -Raw
          if ("$statusOut" -notmatch 'autostart: disabled') { throw "status verb: unexpected output ($statusOut)" }
          cmd /c "`"$exe`" --dump > dump.json"
          $dump = Get-Content dump.json -Raw | ConvertFrom-Json -AsHashtable
          if (($dump.processCount -as [int]) -lt 1) { throw 'dump: processCount missing' }
          Write-Host "pwsh installer dump ok: $($dump.processCount) procs"
          ./cpp/packaging/windows/install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Syspeek") { throw 'uninstall: dir still present' }
          Write-Host 'pwsh installer ok'

      - name: Upload msi artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: syspeek-windows-msi
          path: |
            cpp/build/packaging/Syspeek-*-windows.msi
            cpp/build/packaging/Syspeek-*-windows.msi.sha256
            cpp/build/packaging/Syspeek-*-windows-portable.zip
            cpp/build/packaging/Syspeek-*-windows-portable.zip.sha256
          if-no-files-found: error
      - name: Upload dmg artifact (mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: syspeek-macos-dmg
          path: |
            cpp/build/packaging/Syspeek-*-macos.dmg
            cpp/build/packaging/Syspeek-*-macos.dmg.sha256
          if-no-files-found: error
